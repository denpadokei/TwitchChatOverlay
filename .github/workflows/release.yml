name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # シークレットはコマンドライン引数 (-p:) ではなく環境変数から local.props へ注入する。
      # これによりプロセス引数・MSBuild ログへの露出を避ける。
      - name: Generate build/local.props from secrets
        shell: pwsh
        env:
          TCS_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TCS_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          TCS_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          $esc = { param($v) [System.Security.SecurityElement]::Escape([string]$v) }
          $xml = '<Project><PropertyGroup>' +
                 '<TwitchClientId>' + (& $esc $env:TCS_TWITCH_CLIENT_ID) + '</TwitchClientId>' +
                 '<YouTubeClientId>' + (& $esc $env:TCS_YOUTUBE_CLIENT_ID) + '</YouTubeClientId>' +
                 '<YouTubeClientSecret>' + (& $esc $env:TCS_YOUTUBE_CLIENT_SECRET) + '</YouTubeClientSecret>' +
                 '</PropertyGroup></Project>'
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Content -Path build/local.props -Value $xml -Encoding utf8NoBOM

      - name: Restore dependencies
        run: dotnet restore TwitchChatOverlay/TwitchChatOverlay.csproj

      - name: Extract version from tag
        id: version
        run: echo "VERSION=$('${{ github.ref_name }}' -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish TwitchChatOverlay/TwitchChatOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish

      - name: Verify bundled policy docs
        run: |
          $requiredFiles = @(
            './publish/Docs/PrivacyPolicy.html',
            './publish/Docs/TermsOfUse.html'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required bundled document is missing from publish output: $file"
            }
          }

      - name: Zip artifacts
        run: Compress-Archive -Path ./publish/* -DestinationPath TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip

      - name: Generate SHA256 checksum
        run: |
          $zip = "TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding utf8NoBOM

      - name: Check MSIX signing certificate
        id: msix
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "enabled=true" >> $env:GITHUB_OUTPUT
          $bytes = [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'msix-signing.pfx'), $bytes)

      - name: Build signed MSIX
        if: steps.msix.outputs.enabled == 'true'
        shell: pwsh
        env:
          # パスワードはコマンドライン引数ではなく環境変数で渡す（プロセス引数への露出を避ける）
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: >
          pwsh -NoProfile -File build/Build-Msix.ps1
          -Version "${{ steps.version.outputs.VERSION }}"
          -CertificatePath ./msix-signing.pfx

      - name: Remove MSIX signing certificate
        if: always() && steps.msix.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item ./msix-signing.pfx -Force -ErrorAction SilentlyContinue

      - name: Warn when MSIX signing certificate is missing
        if: steps.msix.outputs.enabled != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::MSIX_CERTIFICATE_BASE64 が未設定のため、このリリースには MSIX が含まれません。"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip
            TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip.sha256
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MSIX to GitHub Release
        if: steps.msix.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/msix/*.msix
            artifacts/msix/*.msix.sha256
            artifacts/msix/*.cer
          token: ${{ secrets.GITHUB_TOKEN }}
