name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # シークレットはコマンドライン引数 (-p:) ではなく環境変数から local.props へ注入する。
      # これによりプロセス引数・MSBuild ログへの露出を避ける。
      - name: Generate build/local.props from secrets
        shell: pwsh
        env:
          TCS_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TCS_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          TCS_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          $esc = { param($v) [System.Security.SecurityElement]::Escape([string]$v) }
          $xml = '<Project><PropertyGroup>' +
                 '<TwitchClientId>' + (& $esc $env:TCS_TWITCH_CLIENT_ID) + '</TwitchClientId>' +
                 '<YouTubeClientId>' + (& $esc $env:TCS_YOUTUBE_CLIENT_ID) + '</YouTubeClientId>' +
                 '<YouTubeClientSecret>' + (& $esc $env:TCS_YOUTUBE_CLIENT_SECRET) + '</YouTubeClientSecret>' +
                 '</PropertyGroup></Project>'
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Content -Path build/local.props -Value $xml -Encoding utf8NoBOM

      - name: Restore dependencies
        run: dotnet restore TwitchChatOverlay/TwitchChatOverlay.csproj

      - name: Extract version from tag
        id: version
        run: echo "VERSION=$('${{ github.ref_name }}' -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish TwitchChatOverlay/TwitchChatOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish

      - name: Verify bundled policy docs
        run: |
          $requiredFiles = @(
            './publish/Docs/PrivacyPolicy.html',
            './publish/Docs/TermsOfUse.html'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required bundled document is missing from publish output: $file"
            }
          }

      - name: Zip artifacts
        run: Compress-Archive -Path ./publish/* -DestinationPath TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip

      - name: Generate SHA256 checksum
        run: |
          $zip = "TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding utf8NoBOM

      - name: Determine MSIX signing method
        id: msix
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          # SignPath Foundation のコード署名証明書 Subject。
          # SignPath 側で証明書が更新された場合はこの値を更新する（MSIX の Identity Publisher と一致必須）。
          $expectedPublisher = 'CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US'

          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            $requiredVariables = @(
              'MSIX_PUBLISHER',
              'SIGNPATH_ORGANIZATION_ID',
              'SIGNPATH_PROJECT_SLUG',
              'SIGNPATH_SIGNING_POLICY_SLUG',
              'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
            )
            $missing = @($requiredVariables | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            })
            if ($missing.Count -gt 0) {
              throw "SignPath を使う場合は次のリポジトリ変数を設定してください (Settings > Secrets and variables > Actions > Variables): $($missing -join ', ')"
            }

            if ($env:MSIX_PUBLISHER -ne $expectedPublisher) {
              throw "MSIX_PUBLISHER が SignPath Foundation の証明書 Subject と一致しません。`n期待値: $expectedPublisher`n実際値: $($env:MSIX_PUBLISHER)"
            }

            "mode=signpath" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            "mode=pfx" >> $env:GITHUB_OUTPUT
            $bytes = [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes((Join-Path $PWD 'msix-signing.pfx'), $bytes)
            exit 0
          }

          "mode=none" >> $env:GITHUB_OUTPUT

      # --- PFX 署名 ---
      - name: Build signed MSIX
        if: steps.msix.outputs.mode == 'pfx'
        shell: pwsh
        env:
          # パスワードはコマンドライン引数ではなく環境変数で渡す（プロセス引数への露出を避ける）
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: >
          pwsh -NoProfile -File build/Build-Msix.ps1
          -Version "${{ steps.version.outputs.VERSION }}"
          -CertificatePath ./msix-signing.pfx

      - name: Remove MSIX signing certificate
        if: always() && steps.msix.outputs.mode == 'pfx'
        shell: pwsh
        run: Remove-Item ./msix-signing.pfx -Force -ErrorAction SilentlyContinue

      # --- SignPath 署名（未署名でビルドして署名を依頼する） ---
      - name: Build unsigned MSIX for SignPath
        if: steps.msix.outputs.mode == 'signpath'
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          pwsh -NoProfile -File build/Build-Msix.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -NoSign -SkipChecksum `
            -Publisher "$env:MSIX_PUBLISHER"

          New-Item -ItemType Directory -Path artifacts/signpath-input -Force | Out-Null
          $msix = Get-ChildItem artifacts/msix/*.msix | Select-Object -First 1
          Copy-Item $msix.FullName artifacts/signpath-input/TwitchChatOverlay.msix

      - name: Upload unsigned MSIX
        id: upload-unsigned-msix
        if: steps.msix.outputs.mode == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned
          path: artifacts/signpath-input/TwitchChatOverlay.msix
          if-no-files-found: error

      - name: Sign MSIX with SignPath
        if: steps.msix.outputs.mode == 'signpath'
        # signpath/github-action-submit-signing-request v3
        uses: SignPath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-msix.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signpath-signed

      - name: Prepare signed MSIX
        if: steps.msix.outputs.mode == 'signpath'
        shell: pwsh
        run: |
          $signed = Get-ChildItem artifacts/signpath-signed -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $signed) {
            throw 'SignPath から署名済み MSIX を取得できませんでした。'
          }

          $final = Get-ChildItem artifacts/msix/*.msix | Select-Object -First 1
          Copy-Item $signed.FullName $final.FullName -Force

          $hash = (Get-FileHash $final.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($final.FullName).sha256" -Value "$hash  $($final.Name)" -Encoding utf8NoBOM

          # 署名の検証（signtool は Windows SDK に含まれる）
          $sdkRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'),
            (Join-Path $env:ProgramFiles 'Windows Kits\10\bin')
          )
          $signtool = foreach ($root in $sdkRoots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            Get-ChildItem -LiteralPath $root -Directory |
              Where-Object Name -match '^\d+\.\d+\.\d+\.\d+$' |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
              Where-Object { Test-Path -LiteralPath $_ }
          } | Select-Object -First 1

          if (-not $signtool) {
            $signtool = (Get-Command 'signtool.exe' -ErrorAction SilentlyContinue).Source
          }
          if (-not $signtool) {
            throw 'signtool.exe が見つかりません（Windows SDK が必要です）。'
          }

          & $signtool verify /pa $final.FullName
          if ($LASTEXITCODE -ne 0) {
            throw '署名済み MSIX の検証に失敗しました。'
          }

      - name: Warn when MSIX signing is not configured
        if: steps.msix.outputs.mode == 'none'
        shell: pwsh
        run: |
          Write-Host "::warning::SIGNPATH_API_TOKEN / MSIX_CERTIFICATE_BASE64 が未設定のため、このリリースには MSIX が含まれません。"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip
            TwitchChatOverlay-${{ github.ref_name }}-win-x64.zip.sha256
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MSIX to GitHub Release
        if: steps.msix.outputs.mode != 'none'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/msix/*.msix
            artifacts/msix/*.msix.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach MSIX certificate to GitHub Release
        if: steps.msix.outputs.mode == 'pfx'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/msix/*.cer
          token: ${{ secrets.GITHUB_TOKEN }}
